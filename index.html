<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIRE ANT LABS</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="apple-touch-icon" href="logo.png">
    <style>
        body { background-color: #0d1117; color: #c9d1d9; font-family: monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        .container { background-color: #161b22; padding: 30px; border-radius: 12px; border: 1px solid #30363d; width: 100%; max-width: 450px; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.5); box-sizing: border-box; }
        .logo-placeholder { font-size: 48px; margin-bottom: 5px; }
        h1 { color: #ff7b72; margin: 0 0 5px 0; font-size: 24px; letter-spacing: 1px; }
        p { color: #8b949e; margin: 0 0 20px 0; font-size: 14px; }
        textarea { width: 100%; height: 120px; background-color: #0d1117; color: #c9d1d9; border: 1px solid #30363d; border-radius: 6px; padding: 12px; box-sizing: border-box; resize: none; font-family: monospace; font-size: 14px; outline: none; }
        textarea:focus { border-color: #58a6ff; }
        button { background-color: #238636; color: white; border: none; padding: 14px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 15px; width: 100%; font-size: 14px; transition: background 0.2s; }
        button:hover { background-color: #2ea043; }
        button:disabled { background-color: #21262d; color: #8b949e; cursor: not-allowed; border: 1px solid #30363d; }
        #log-output { margin-top: 20px; background: #0d1117; border: 1px solid #30363d; padding: 12px; border-radius: 6px; text-align: left; font-size: 12px; max-height: 250px; overflow-y: auto; display: none; color: #58a6ff; line-height: 1.6; }
        .download-btn { display: inline-block; background-color: #21262d; color: #58a6ff; border: 1px solid #30363d; padding: 12px 15px; border-radius: 6px; font-weight: bold; text-decoration: none; margin-top: 15px; width: 100%; box-sizing: border-box; font-size: 13px; text-align: center; cursor: pointer; transition: background 0.2s; }
        .download-btn:hover { background-color: #30363d; color: #ecf2f8; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-placeholder" id="company-logo">🐜</div>
        <h1>FIRE ANT LABS</h1>
        <p>Autonomous Software Pipeline</p>
        <textarea id="task-input" placeholder="Describe the software you want FIRE ANT to design..."></textarea>
        <button id="pipeline-btn" onclick="runPipeline()">Generate & Self-Correct Code</button>
        <div id="log-output"></div>
    </div>

    <script>
        let manufacturedCode = "";
        let globalFileName = "app.html";

        async function runPipeline() {
            const btn = document.getElementById('pipeline-btn');
            const log = document.getElementById('log-output');
            const input = document.getElementById('task-input').value.trim();
            
            if (!input) return alert("Please enter a software task description.");
            
            btn.disabled = true;
            btn.innerText = "FIRE ANT Engine Initializing...";
            log.style.display = "block";
            log.innerHTML = "📡 Packaging transmission payload...<br>⚙️ Activating local hardware processing rails...";
            
            try {
                log.innerHTML += "<br>🚀 Routing architecture request to FIRE ANT compilation backend...";
                
                // Replace the URL below with your actual live Render app URL once deployed
                const response = await fetch('https://onrender.com', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: input })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    manufacturedCode = data.code;
                    globalFileName = data.filename;
                    
                    log.innerHTML += `<br>📝 Compiling file architecture...<br>🔧 Running automated system check...<br>✨ <b>SYSTEM RESOLVED: ${data.message}</b>`;
                    log.innerHTML += `<div class="download-btn" onclick="forceDownload()">📥 Download App Bundle (${globalFileName})</div>`;
                } else {
                    log.innerHTML += `<br>❌ Pipeline failure: ${data.error}`;
                }
            } catch (error) {
                log.innerHTML += "<br>❌ Critical Network Error: Could not reach the Fire Ant Python backend engine. Make sure your server script is running.";
                console.error(error);
            } finally {
                btn.disabled = false;
                btn.innerText = "Generate & Self-Correct Code";
            }
        }

        function forceDownload() {
            if (!manufacturedCode) return alert("No compilation bundle found.");
            const blob = new Blob([manufacturedCode], { type: 'text/html' });
            const element = document.createElement('a');
            element.href = URL.createObjectURL(blob);
            element.download = globalFileName;
            document.body.appendChild(element);
            element.click();
            document.body.removeChild(element);
        }
    </script>
</body>
</html>
