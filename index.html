<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FIRE ANT LABS</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="apple-touch-icon" href="logo.png">
    <style>
        body { background-color: #0d1117; color: #c9d1d9; font-family: monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        .container { background-color: #161b22; padding: 30px; border-radius: 12px; border: 1px solid #30363d; width: 100%; max-width: 450px; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.5); box-sizing: border-box; }
        .logo-placeholder { font-size: 54px; margin-bottom: 5px; }
        h1 { color: #ff7b72; margin: 0; font-size: 26px; letter-spacing: 2px; font-weight: bold; }
        p { color: #8b949e; margin: 0 0 25px 0; font-size: 13px; text-transform: uppercase; letter-spacing: 1px; }
        textarea { width: 100%; height: 130px; background-color: #0d1117; color: #c9d1d9; border: 1px solid #30363d; border-radius: 8px; padding: 14px; box-sizing: border-box; resize: none; font-family: monospace; font-size: 14px; outline: none; -webkit-appearance: none; margin-bottom: 15px; }
        textarea:focus { border-color: #58a6ff; }
        button { background-color: #238636; color: white; border: none; padding: 16px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; font-size: 14px; -webkit-appearance: none; touch-action: manipulation; letter-spacing: 1px; text-transform: uppercase; box-shadow: 0 3px 10px rgba(35,134,54,0.3); }
        button:hover { background-color: #2ea043; }
        #log-output { margin-top: 20px; background: #0d1117; border: 1px solid #30363d; padding: 12px; border-radius: 6px; text-align: left; font-size: 12px; display: none; color: #39ff14; line-height: 1.6; font-family: monospace; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-placeholder">🐜</div>
        <h1>FIRE ANT LABS</h1>
        <p>Instant App Refinery</p>
        <textarea id="task-input" placeholder="What application should FIRE ANT build and deploy instantly?..."></textarea>
        <button id="pipeline-btn" onclick="runPipeline()">Launch Application Natively</button>
        <div id="log-output"></div>
    </div>
    <script>
        function escapeHTML(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        function runPipeline() {
            const input = document.getElementById('task-input').value.trim();
            if (!input) return alert("Please specify what application to compile.");
            
            const query = input.toLowerCase();
            
            let pColor = "#ff7b72", aColor = "#58a6ff", appBg = "#161b22", cardBg = "#0d1117", textColor = "#c9d1d9", appTitle = "Custom Core Utility";
            
            if (query.includes("game") || query.includes("clicker") || query.includes("gamer") || query.includes("play")) {
                appTitle = "🎮 Gamer Stats Dashboard";
                pColor = "#00ffcc"; aColor = "#ff007f";
            } else if (query.includes("flashcard") || query.includes("study") || query.includes("quiz") || query.includes("school") || query.includes("history")) {
                appTitle = "🎓 Student Intel Hub";
                pColor = "#4f46e5"; aColor = "#2563eb"; appBg = "#f6f8fa"; cardBg = "#ffffff"; textColor = "#24292f";
            } else if (query.includes("matrix") || query.includes("terminal") || query.includes("green")) {
                appTitle = "💻 Dev Console Sandbox";
                pColor = "#39ff14"; aColor = "#00ff00";
            }

            let coreModule = ""; let customScript = "";

            if (query.includes("flashcard") || query.includes("study") || query.includes("quiz") || query.includes("test")) {
                coreModule = "<div style='background:" + cardBg + ";padding:25px;border-radius:8px;border:1px solid #30363d;text-align:left;'><span style='color:" + pColor + ";font-size:11px;font-weight:bold;text-transform:uppercase;'>Interactive Study Core</span><h3 id=\"quiz-q\" style=\"color:" + textColor + ";margin:10px 0;\">Initializing...</h3><input type=\"text\" id=\"quiz-ans\" style=\"width:100%;padding:12px;background:#161b22;border:1px solid #30363d;color:white;border-radius:6px;box-sizing:border-box;margin-bottom:10px;outline:none;\" placeholder=\"Type your solution...\"><button style=\"background:" + pColor + ";color:white;border:none;padding:12px;font-weight:bold;border-radius:6px;width:100%;cursor:pointer;\" onclick=\"verifyAnswer()\">SUBMIT VERIFICATION</button><h4 id=\"quiz-feedback\" style=\"margin-top:15px;margin-bottom:0;display:none;\"></h4></div>";
                customScript = "let cards = [{q: \"What blueprint guidelines are loaded?\", a: \"" + escapeHTML(input) + "\"}, {q: \"What framework manages this script?\", a: \"local rails\"}]; let currentIdx = 0; document.getElementById('quiz-q').innerText = cards[currentIdx].q; function verifyAnswer() { const feedback = document.getElementById('quiz-feedback'); const userVal = document.getElementById('quiz-ans').value.trim().toLowerCase(); feedback.style.display = 'block'; if(userVal === cards[currentIdx].a.toLowerCase()) { feedback.style.color = '#56d364'; feedback.innerText = '✨ CORRECT!'; setTimeout(() => { currentIdx = (currentIdx + 1) % cards.length; document.getElementById('quiz-q').innerText = cards[currentIdx].q; document.getElementById('quiz-ans').value = ''; feedback.style.display = 'none'; }, 2000); } else { feedback.style.color = '#ff7b72'; feedback.innerText = '❌ TRY AGAIN'; } }";
            }
            else if (query.includes("calculator") || query.includes("math") || query.includes("calculate")) {
                appTitle = "🧮 Fire Ant Calculation Array";
                coreModule = "<div style='background:" + cardBg + ";padding:20px;border-radius:8px;border:1px solid #30363d;'><input type='text' id='calc-display' style='width:100%;padding:12px;background:#161b22;border:1px solid #30363d;color:white;text-align:right;font-size:20px;margin-bottom:12px;box-sizing:border-box;' readonly value=''><div style='display:grid;grid-template-columns:repeat(4,1fr);gap:6px;'><button style='padding:12px;background:#30363d;color:white;border:none;border-radius:4px;font-weight:bold;cursor:pointer;' onclick=\"pressKey('clear')\">C</button><button style='padding:12px;background:#21262d;color:" + aColor + ";border:none;border-radius:4px;font-weight:bold;cursor:pointer;' onclick=\"pressKey('/')\">/</button><button style='padding:12px;background:#21262d;color:" + aColor + ";border:none;border-radius:4px;font-weight:bold;cursor:pointer;' onclick=\"pressKey('*')\">*</button><button style='padding:12px;background:#21262d;color:" + aColor + ";border:none;border-radius:4px;font-weight:bold;cursor:pointer;' onclick=\"pressKey('-')\">-</button><button style='padding:12px;background:#161b22;color:white;border:none;border-radius:4px;cursor:pointer;' onclick=\"pressKey('7')\">7</button><button style='padding:12px;background:#161b22;color:white;border:none;border-radius:4px;cursor:pointer;' onclick=\"pressKey('8')\">8</button><button style='padding:12px;background:#161b22;color:white;border:none;border-radius:4px;cursor:pointer;' onclick=\"pressKey('9')\">9</button><button style='padding:12px;background:#21262d;color:" + aColor + ";border:none;border-radius:4px;font-weight:bold;cursor:pointer;' onclick=\"pressKey('+')\">+</button><button style='padding:12px;background:#161b22;color:white;border:none;border-radius:4px;cursor:pointer;' onclick=\"pressKey('4')\">4</button><button style='padding:12px;background:#161b22;color:white;border:none;border-radius:4px;cursor:pointer;' onclick=\"pressKey('5')\">5</button><button style='padding:12px;background:#161b22;color:white;border:none;border-radius:4px;cursor:pointer;' onclick=\"pressKey('6')\">6</button><button style='grid-row:span 2;padding:12px;background:" + pColor + ";color:#0d1117;border:none;border-radius:4px;font-weight:bold;cursor:pointer;' onclick=\"pressKey('=')\">=</button><button style='padding:12px;background:#161b22;color:white;border:none;border-radius:4px;cursor:pointer;' onclick=\"pressKey('1')\">1</button><button style='padding:12px;background:#161b22;color:white;border:none;border-radius:4px;cursor:pointer;' onclick=\"pressKey('2')\">2</button><button style='padding:12px;background:#161b22;color:white;border:none;border-radius:4px;cursor:pointer;' onclick=\"pressKey('3')\">3</button><button style='grid-column:span 3;padding:12px;background:#161b22;color:white;border:none;border-radius:4px;cursor:pointer;' onclick=\"pressKey('0')\">0</button></div></div>";
                customScript = "function pressKey(v) { const disp = document.getElementById('calc-display'); if(v=='clear') disp.value=''; else if(v=='=') { try{disp.value=eval(disp.value)}catch(e){disp.value='Error'} } else disp.value+=v; }";
            } else {
                appTitle = "👾 Fire Ant Arcade Core";
                coreModule = "<div style=\"background:" + cardBg + ";padding:25px;border-radius:8px;border:1px solid #30363d;\"><h3 style=\"color:" + pColor + ";\">Loop: " + escapeHTML(input) + "</h3><h1 id=\"score-tracker\" style=\"color:white;font-size:54px;margin:10px 0;\">0</h1><button style=\"background:" + pColor + ";color:#0d1117;border:none;padding:12px;font-weight:bold;border-radius:6px;width:100%;cursor:pointer;\" onclick=\"document.getElementById('score-tracker').innerText = parseInt(document.getElementById('score-tracker').innerText)+1\">INCREMENT SCORE</button></div>";
            }

            const manufacturedCode = "<!DOCTYPE html><html><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no'><title>Custom App</title><style>body{background-color:#0d1117;color:#c9d1d9;font-family:sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;padding:20px;box-sizing:border-box;} .app-box{background-color:" + appBg + ";padding:30px;border-radius:12px;border:1px solid #30363d;width:100%;max-width:420px;text-align:center;box-shadow:0 4px 20px rgba(0,0,0,0.5);color:" + (appBg==='#ffffff'?'#0d1117':'#c9d1d9') + ";} h2{color:" + pColor + ";margin-top:0;font-size:24px;} .badge{display:inline-block;background-color:rgba(35,134,54,0.15);color:#56d364;border:1px solid rgba(46,160,67,0.4);padding:6px 14px;border-radius:20px;font-size:11px;font-weight:bold;text-transform:uppercase;}</style></head><body><div class='app-box'><h2>" + appTitle + "</h2><div class='badge'>⚡ FIRE ANT LABS VERIFIED BUILD</div><div style='margin-top:20px;'>" + coreModule + "</div></div><script>" + customScript + "<\/script></body></html>";

            const base64Code = btoa(unescape(encodeURIComponent(manufacturedCode)));
            const dataUrl = "data:text/html;base64," + base64Code;
            const newTab = window.open();
            if (newTab) {
                newTab.location.href = dataUrl;
            } else {
                alert("⚠️ App launcher intercepted. Please allow popups for this site in your Safari/Chrome settings to initialize instant runtime rails.");
            }
        }
    </script>
</body>
</html>
